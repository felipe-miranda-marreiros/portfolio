h="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="1206" rx="24" fill="#0b1220"/><text class="c0" x="40" y="62">Harness quality gates</text><text class="c1" x="40" y="89">How an AI agent's work is planned, then checked on its way to main</text><rect class="c2" x="40" y="112" width="1520" height="156" rx="18"/><rect class="c3" x="40" y="140" width="5" height="100" rx="2.5"/><text class="c4" x="70" y="176.8">PLANNING</text><text class="c5"><tspan x="70" y="204.8">Only a human</tspan><tspan x="70" y="223.5">advances a stage.</tspan></text><text class="c6" x="244" y="138.5">In the repo, through docs-only PRs</text><path class="c7" d="M244 150L868 150"/><text class="c6" x="892" y="138.5">On GitHub, as issues and sub-issues</text><path class="c7" d="M892 150L1300 150"/><text class="c6" x="1324" y="138.5">Runs stages 1 to 4 below</text><path class="c7" d="M1324 150L1516 150"/><rect class="c8" x="244" y="158" width="192" height="52" rx="10"/><rect class="c9" x="258" y="170" width="4" height="28" rx="2"/><text class="c10" x="274" y="182">/vision</text><text class="c6" x="274" y="199.5">docs/VISION.md</text><rect class="c8" x="460" y="158" width="192" height="52" rx="10"/><rect class="c9" x="474" y="170" width="4" height="28" rx="2"/><text class="c10" x="490" y="182">/grill-with-docs</text><text class="c6" x="490" y="199.5">docs/adr/</text><path class="c11" d="M440 184L458 184" marker-end="url(#h)"/><rect class="c8" x="676" y="158" width="192" height="52" rx="10"/><rect class="c9" x="690" y="170" width="4" height="28" rx="2"/><text class="c10" x="706" y="182">/roadmap</text><text class="c6" x="706" y="199.5">docs/ROADMAP.md</text><path class="c11" d="M656 184L674 184" marker-end="url(#h)"/><rect class="c8" x="892" y="158" width="192" height="52" rx="10"/><rect class="c9" x="906" y="170" width="4" height="28" rx="2"/><text class="c10" x="922" y="182">/to-spec</text><text class="c6" x="922" y="199.5">Spec issue</text><path class="c11" d="M872 184L890 184" marker-end="url(#h)"/><rect class="c8" x="1108" y="158" width="192" height="52" rx="10"/><rect class="c9" x="1122" y="170" width="4" height="28" rx="2"/><text class="c10" x="1138" y="182">/to-tickets</text><text class="c6" x="1138" y="199.5">Ticket sub-issues</text><path class="c11" d="M1088 184L1106 184" marker-end="url(#h)"/><rect class="c8" x="1324" y="158" width="192" height="52" rx="10"/><rect class="c9" x="1338" y="170" width="4" height="28" rx="2"/><text class="c10" x="1354" y="182">/implement</text><text class="c6" x="1354" y="199.5">One code PR per Ticket</text><path class="c11" d="M1304 184L1322 184" marker-end="url(#h)"/><path class="c12" d="M664 192L664 226"/><text class="c13" x="664" y="242.5">Vision approved</text><path class="c12" d="M880 192L880 226"/><text class="c13" x="880" y="242.5">Milestone in-progress</text><path class="c12" d="M1091 230L1091 246"/><text class="c6" x="1103" y="242.5">Approval: a human runs the Approve workflow</text><text class="c14" x="70" y="315">EVERY CHANGE</text><rect class="c8" x="244" y="288" width="300" height="44" rx="22"/><circle class="c15" cx="270" cy="310" r="13"/><text class="c16" x="270" y="316">1</text><text class="c17" x="296" y="317">Plan</text><rect class="c8" x="568" y="288" width="300" height="44" rx="22"/><circle class="c15" cx="594" cy="310" r="13"/><text class="c16" x="594" y="316">2</text><text class="c17" x="620" y="317">Write</text><path class="c11" d="M548 310L566 310" marker-end="url(#h)"/><rect class="c8" x="892" y="288" width="300" height="44" rx="22"/><circle class="c15" cx="918" cy="310" r="13"/><text class="c16" x="918" y="316">3</text><text class="c17" x="944" y="317">Commit and push</text><path class="c11" d="M872 310L890 310" marker-end="url(#h)"/><rect class="c8" x="1216" y="288" width="300" height="44" rx="22"/><circle class="c15" cx="1242" cy="310" r="13"/><text class="c16" x="1242" y="316">4</text><text class="c17" x="1268" y="317">Pull request</text><path class="c11" d="M1196 310L1214 310" marker-end="url(#h)"/><rect class="c18" x="40" y="356" width="1520" height="282" rx="18"/><rect class="c19" x="40" y="384" width="5" height="226" rx="2.5"/><text class="c20" x="70" y="474">DETERMINISTIC</text><text class="c5"><tspan x="70" y="502">Same input,</tspan><tspan x="70" y="520.8">same verdict.</tspan><tspan x="70" y="539.5">Blocks the work.</tspan></text><rect class="c21" x="244" y="440" width="300" height="52" rx="10"/><rect class="c19" x="258" y="452" width="4" height="28" rx="2"/><text class="c10" x="274" y="464">issue-title.yml</text><text class="c6" x="274" y="481.5">Issue title lint, comments only</text><rect class="c21" x="244" y="502" width="300" height="52" rx="10"/><rect class="c19" x="258" y="514" width="4" height="28" rx="2"/><text class="c10" x="274" y="526">bun run frontier</text><text class="c6" x="274" y="543.5">Milestone and Ticket Frontiers</text><rect class="c21" x="568" y="409" width="300" height="52" rx="10"/><rect class="c19" x="582" y="421" width="4" height="28" rx="2"/><text class="c10" x="598" y="433">PreToolUse: gh pr</text><text class="c6" x="598" y="450.5">Blocks a bad body or Ticket</text><rect class="c21" x="568" y="471" width="300" height="52" rx="10"/><rect class="c19" x="582" y="483" width="4" height="28" rx="2"/><text class="c10" x="598" y="495">PreToolUse: gh issue</text><text class="c6" x="598" y="512.5">Denies issue close, blocker removal</text><rect class="c21" x="568" y="533" width="300" height="52" rx="10"/><rect class="c19" x="582" y="545" width="4" height="28" rx="2"/><text class="c10" x="598" y="557">bun test</text><text class="c6" x="598" y="574.5">Covers hooks and planning scripts</text><rect class="c21" x="892" y="409" width="300" height="52" rx="10"/><rect class="c19" x="906" y="421" width="4" height="28" rx="2"/><text class="c10" x="922" y="433">pre-commit</text><text class="c6" x="922" y="450.5">Biome on staged files, 5k-token cap</text><rect class="c21" x="892" y="471" width="300" height="52" rx="10"/><rect class="c19" x="906" y="483" width="4" height="28" rx="2"/><text class="c10" x="922" y="495">commit-msg</text><text class="c6" x="922" y="512.5">commitlint: Conventional Commits</text><rect class="c21" x="892" y="533" width="300" height="52" rx="10"/><rect class="c19" x="906" y="545" width="4" height="28" rx="2"/><text class="c10" x="922" y="557">pre-push</text><text class="c6" x="922" y="574.5">Branch name: type/kebab-description</text><rect class="c21" x="1216" y="378" width="300" height="52" rx="10"/><rect class="c19" x="1230" y="390" width="4" height="28" rx="2"/><text class="c10" x="1246" y="402">pr.yml</text><text class="c6" x="1246" y="419.5">Commits, title, branch name, PR body</text><rect class="c21" x="1216" y="440" width="300" height="52" rx="10"/><rect class="c19" x="1230" y="452" width="4" height="28" rx="2"/><text class="c10" x="1246" y="464">pr.yml: ticket job</text><text class="c6" x="1246" y="481.5">Closes one Ticket whose turn came</text><rect class="c21" x="1216" y="502" width="300" height="52" rx="10"/><rect class="c19" x="1230" y="514" width="4" height="28" rx="2"/><text class="c10" x="1246" y="526">planning.yml</text><text class="c6" x="1246" y="543.5">Doc format, isolated Status: changes</text><rect class="c21" x="1216" y="564" width="300" height="52" rx="10"/><rect class="c19" x="1230" y="576" width="4" height="28" rx="2"/><text class="c10" x="1246" y="588">lint.yml</text><text class="c6" x="1246" y="605.5">biome ci on every PR and on main</text><rect class="c22" x="40" y="658" width="1520" height="468" rx="18"/><rect class="c23" x="40" y="686" width="5" height="412" rx="2.5"/><text class="c24" x="70" y="869">NON-DETERMINISTIC</text><text class="c5"><tspan x="70" y="897">Steers the model.</tspan><tspan x="70" y="915.8">Cannot be proven.</tspan><tspan x="70" y="934.5">Improves the odds.</tspan></text><rect class="c25" x="244" y="680" width="300" height="52" rx="10"/><rect class="c23" x="258" y="692" width="4" height="28" rx="2"/><text class="c10" x="274" y="704">rules/planning.md</text><text class="c6" x="274" y="721.5">Stages, Blockers, Frontier, Approval</text><rect class="c25" x="244" y="742" width="300" height="52" rx="10"/><rect class="c23" x="258" y="754" width="4" height="28" rx="2"/><text class="c10" x="274" y="766">vision, roadmap</text><text class="c6" x="274" y="783.5">Write Vision and Roadmap PRs</text><rect class="c25" x="244" y="804" width="300" height="52" rx="10"/><rect class="c23" x="258" y="816" width="4" height="28" rx="2"/><text class="c10" x="274" y="828">grill-me, grill-with-docs</text><text class="c6" x="274" y="845.5">Stress-test the plan via grilling</text><rect class="c25" x="244" y="866" width="300" height="52" rx="10"/><rect class="c23" x="258" y="878" width="4" height="28" rx="2"/><text class="c10" x="274" y="890">domain-modeling</text><text class="c6" x="274" y="907.5">Glossary terms and ADRs</text><rect class="c25" x="244" y="928" width="300" height="52" rx="10"/><rect class="c23" x="258" y="940" width="4" height="28" rx="2"/><text class="c10" x="274" y="952">to-spec, to-tickets</text><text class="c6" x="274" y="969.5">Spec and tracer-bullet tickets</text><rect class="c25" x="244" y="990" width="300" height="52" rx="10"/><rect class="c23" x="258" y="1002" width="4" height="28" rx="2"/><text class="c10" x="274" y="1014">triage</text><text class="c6" x="274" y="1031.5">Issues into agent-ready briefs</text><rect class="c25" x="244" y="1052" width="300" height="52" rx="10"/><rect class="c23" x="258" y="1064" width="4" height="28" rx="2"/><text class="c10" x="274" y="1076">docs/agents/</text><text class="c6" x="274" y="1093.5">Issue tracker and label config</text><rect class="c25" x="568" y="711" width="300" height="52" rx="10"/><rect class="c23" x="582" y="723" width="4" height="28" rx="2"/><text class="c10" x="598" y="735">CLAUDE.md + rules</text><text class="c6" x="598" y="752.5">Project guidance in every session</text><rect class="c25" x="568" y="773" width="300" height="52" rx="10"/><rect class="c23" x="582" y="785" width="4" height="28" rx="2"/><text class="c10" x="598" y="797">implement, tdd</text><text class="c6" x="598" y="814.5">Build from tickets, test first</text><rect class="c25" x="568" y="835" width="300" height="52" rx="10"/><rect class="c23" x="582" y="847" width="4" height="28" rx="2"/><text class="c10" x="598" y="859">codebase-design</text><text class="c6" x="598" y="876.5">Deep modules and seams</text><rect class="c25" x="568" y="897" width="300" height="52" rx="10"/><rect class="c23" x="582" y="909" width="4" height="28" rx="2"/><text class="c10" x="598" y="921">improve-codebase-architecture</text><text class="c6" x="598" y="938.5">Deepening opportunities report</text><rect class="c25" x="568" y="959" width="300" height="52" rx="10"/><rect class="c23" x="582" y="971" width="4" height="28" rx="2"/><text class="c10" x="598" y="983">ponytail skill</text><text class="c6" x="598" y="1000.5">Smallest complete change</text><rect class="c25" x="568" y="1021" width="300" height="52" rx="10"/><rect class="c23" x="582" y="1033" width="4" height="28" rx="2"/><text class="c10" x="598" y="1045">impeccable skill</text><text class="c6" x="598" y="1062.5">Frontend design, critique, audit</text><rect class="c25" x="892" y="835" width="300" height="52" rx="10"/><rect class="c23" x="906" y="847" width="4" height="28" rx="2"/><text class="c10" x="922" y="859">code-review: Standards</text><text class="c6" x="922" y="876.5">Diff against the documented rules</text><rect class="c25" x="892" y="897" width="300" height="52" rx="10"/><rect class="c23" x="906" y="909" width="4" height="28" rx="2"/><text class="c10" x="922" y="921">code-review: Spec</text><text class="c6" x="922" y="938.5">Diff against the issue or spec</text><rect class="c25" x="1216" y="835" width="300" height="52" rx="10"/><rect class="c23" x="1230" y="847" width="4" height="28" rx="2"/><text class="c10" x="1246" y="859">pr skill</text><text class=