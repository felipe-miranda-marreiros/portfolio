<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="720" viewBox="0 0 1360 720" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Harness quality gates: deterministic and non-deterministic checks across write, commit and push, and pull request</title><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1360" height="720" rx="24" fill="#0b1220"/><text font-size="28" fill="#f8fafc" text-anchor="start" font-weight="600"><tspan x="40" y="62">Harness quality gates</tspan></text><text font-size="15" fill="#94a3b8" text-anchor="start"><tspan x="40" y="89">How an AI agent's work is checked on its way to main</tspan></text><rect x="260" y="112" width="320" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="286" cy="134" r="13" fill="#0b1220" stroke="#94a3b8" stroke-width="2"/><text font-size="14" fill="#f1f5f9" text-anchor="middle" font-weight="600"><tspan x="286" y="140">1</tspan></text><text font-size="17" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="312" y="141">Write</tspan></text><rect x="608" y="112" width="320" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="634" cy="134" r="13" fill="#0b1220" stroke="#94a3b8" stroke-width="2"/><text font-size="14" fill="#f1f5f9" text-anchor="middle" font-weight="600"><tspan x="634" y="140">2</tspan></text><text font-size="17" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="660" y="141">Commit and push</tspan></text><rect x="956" y="112" width="320" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="982" cy="134" r="13" fill="#0b1220" stroke="#94a3b8" stroke-width="2"/><text font-size="14" fill="#f1f5f9" text-anchor="middle" font-weight="600"><tspan x="982" y="140">3</tspan></text><text font-size="17" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="1008" y="141">Pull request</tspan></text><path d="M584 134L606 134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#h)"/><path d="M932 134L954 134" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#h)"/><rect x="40" y="180" width="1280" height="220" rx="18" fill="#0f1f1d" stroke="#14463f" stroke-width="1.5"/><rect x="40" y="208" width="5" height="164" rx="2.5" fill="#34d399" stroke="#34d399" stroke-width="0"/><text font-size="13" fill="#34d399" text-anchor="start" font-weight="600" letter-spacing="1.5"><tspan x="70" y="267">DETERMINISTIC</tspan></text><text font-size="15" fill="#f1f5f9" text-anchor="start"><tspan x="70" y="295">Same input,</tspan><tspan x="70" y="313.75">same verdict.</tspan><tspan x="70" y="332.5">Blocks the work.</tspan></text><rect x="260" y="233" width="320" height="52" rx="10" fill="#14302b" stroke="#1d5a4f" stroke-width="1.5"/><rect x="274" y="245" width="4" height="28" rx="2" fill="#34d399" stroke="#34d399" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="290" y="257">PreToolUse hook</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="290" y="274.5">Blocks gh pr create with a bad body</tspan></text><rect x="260" y="295" width="320" height="52" rx="10" fill="#14302b" stroke="#1d5a4f" stroke-width="1.5"/><rect x="274" y="307" width="4" height="28" rx="2" fill="#34d399" stroke="#34d399" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="290" y="319">bun test</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="290" y="336.5">Covers the PR body check</tspan></text><rect x="608" y="202" width="320" height="52" rx="10" fill="#14302b" stroke="#1d5a4f" stroke-width="1.5"/><rect x="622" y="214" width="4" height="28" rx="2" fill="#34d399" stroke="#34d399" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="638" y="226">pre-commit</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="638" y="243.5">Biome on staged files, 5k-token file cap</tspan></text><rect x="608" y="264" width="320" height="52" rx="10" fill="#14302b" stroke="#1d5a4f" stroke-width="1.5"/><rect x="622" y="276" width="4" height="28" rx="2" fill="#34d399" stroke="#34d399" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="638" y="288">commit-msg</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="638" y="305.5">commitlint: Conventional Commits</tspan></text><rect x="608" y="326" width="320" height="52" rx="10" fill="#14302b" stroke="#1d5a4f" stroke-width="1.5"/><rect x="622" y="338" width="4" height="28" rx="2" fill="#34d399" stroke="#34d399" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="638" y="350">pre-push</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="638" y="367.5">Branch name: type/kebab-description</tspan></text><rect x="956" y="202" width="320" height="52" rx="10" fill="#14302b" stroke="#1d5a4f" stroke-width="1.5"/><rect x="970" y="214" width="4" height="28" rx="2" fill="#34d399" stroke="#34d399" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="986" y="226">pr.yml</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="986" y="243.5">Commits, title, branch name, PR body</tspan></text><rect x="956" y="264" width="320" height="52" rx="10" fill="#14302b" stroke="#1d5a4f" stroke-width="1.5"/><rect x="970" y="276" width="4" height="28" rx="2" fill="#34d399" stroke="#34d399" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="986" y="288">lint.yml</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="986" y="305.5">biome ci on every PR and on main</tspan></text><rect x="956" y="326" width="320" height="52" rx="10" fill="#14302b" stroke="#1d5a4f" stroke-width="1.5"/><rect x="970" y="338" width="4" height="28" rx="2" fill="#34d399" stroke="#34d399" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="986" y="350">issue-title.yml</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="986" y="367.5">Issue title lint, comments only</tspan></text><rect x="40" y="420" width="1280" height="220" rx="18" fill="#1a1530" stroke="#3b2f6b" stroke-width="1.5"/><rect x="40" y="448" width="5" height="164" rx="2.5" fill="#a78bfa" stroke="#a78bfa" stroke-width="0"/><text font-size="13" fill="#a78bfa" text-anchor="start" font-weight="600" letter-spacing="1.5"><tspan x="70" y="507">NON-DETERMINISTIC</tspan></text><text font-size="15" fill="#f1f5f9" text-anchor="start"><tspan x="70" y="535">Steers the model.</tspan><tspan x="70" y="553.75">Cannot be proven.</tspan><tspan x="70" y="572.5">Improves the odds.</tspan></text><rect x="260" y="473" width="320" height="52" rx="10" fill="#241d44" stroke="#4a3b86" stroke-width="1.5"/><rect x="274" y="485" width="4" height="28" rx="2" fill="#a78bfa" stroke="#a78bfa" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="290" y="497">CLAUDE.md + rules</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="290" y="514.5">Project guidance in every session</tspan></text><rect x="260" y="535" width="320" height="52" rx="10" fill="#241d44" stroke="#4a3b86" stroke-width="1.5"/><rect x="274" y="547" width="4" height="28" rx="2" fill="#a78bfa" stroke="#a78bfa" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="290" y="559">ponytail skill</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="290" y="576.5">Smallest complete change</tspan></text><rect x="608" y="473" width="320" height="52" rx="10" fill="#241d44" stroke="#4a3b86" stroke-width="1.5"/><rect x="622" y="485" width="4" height="28" rx="2" fill="#a78bfa" stroke="#a78bfa" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="638" y="497">code-review: Standards</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="638" y="514.5">Diff against the documented rules</tspan></text><rect x="608" y="535" width="320" height="52" rx="10" fill="#241d44" stroke="#4a3b86" stroke-width="1.5"/><rect x="622" y="547" width="4" height="28" rx="2" fill="#a78bfa" stroke="#a78bfa" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="638" y="559">code-review: Spec</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="638" y="576.5">Diff against the issue or spec</tspan></text><rect x="956" y="473" width="320" height="52" rx="10" fill="#241d44" stroke="#4a3b86" stroke-width="1.5"/><rect x="970" y="485" width="4" height="28" rx="2" fill="#a78bfa" stroke="#a78bfa" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="986" y="497">pr skill</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="986" y="514.5">Writes Summary, Evidence, Merge Danger</tspan></text><rect x="956" y="535" width="320" height="52" rx="10" fill="#241d44" stroke="#4a3b86" stroke-width="1.5"/><rect x="970" y="547" width="4" height="28" rx="2" fill="#a78bfa" stroke="#a78bfa" stroke-width="0"/><text font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600"><tspan x="986" y="559">Reviewer</tspan></text><text font-size="12.5" fill="#94a3b8" text-anchor="start"><tspan x="986" y="576.5">Reads the body and decides to merge</tspan></text><path d="M1116 646L1116 672L420 672L420 648" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#h)"/><text font-size="13" fill="#94a3b8" text-anchor="middle"><tspan x="768" y="695">A gate fails: the agent fixes the work and tries again</tspan></text></svg>
