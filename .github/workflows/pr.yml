name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint commits in PR
        run: bunx --no-install commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --no-install commitlint --verbose

  branch:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: sh scripts/check-branch-name.sh "$HEAD_REF"

  body:
    name: PR body
    runs-on: ubuntu-latest
    steps:
      - name: Check body follows the pr skill
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          status=0
          for section in "Summary" "Evidence" "Merge Danger"; do
            if ! printf '%s\n' "$PR_BODY" | grep -Eq "^##[[:space:]]+$section"; then
              echo "✖ PR body is missing a '## $section' section (see .claude/skills/pr/SKILL.md)" >&2
              status=1
            fi
          done
          exit $status
