name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint commits in PR
        run: bunx --no-install commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --no-install commitlint --verbose

  branch:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: sh scripts/check-branch-name.sh "$HEAD_REF"

  body:
    name: PR body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check body follows the pr skill
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun scripts/pr-body.ts

  ticket:
    name: Ticket
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      # the script and the Roadmap come from the base branch, so a PR can't edit either to pass;
      # the branch rather than base.sha, so a re-run sees a Milestone approved since the PR was opened
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - uses: oven-sh/setup-bun@v2
      - name: Check the PR closes one Ticket whose turn has come
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ROADMAP_REF: HEAD
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/ticket-gate.ts ]; then bun scripts/ticket-gate.ts
          else echo "✔ scripts/ticket-gate.ts is not on the base branch yet, so the gate is inactive"; fi
