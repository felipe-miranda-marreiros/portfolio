name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx --no-install biome ci .
